<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Food Menu</title>
    <style>
        body {
            font-family: Arial;
            background-color: bisque;
            padding: 30px;
            text-align: center;
        }

        h1 {
            color: rgb(231, 231, 12);
        }

        h1 + p {
            background-color:rgb(238, 182, 97);
            padding: 10px 20px;
            border-radius: 8px;
            color:rgb(81, 53, 10);
            display: inline-block;
        }

        ul {
            padding: 0;
            margin-top: 20px;
        }

        ul > li {
            list-style: none;
            font-size: 18px;
            font-weight: bold;
            color:rgb(35, 151, 254);
            padding: 10px 20px;
            margin: 6px auto;
            width: 260px;
            background-color:rgb(176, 217, 254);
            border-radius: 8px;
        }

        ul li:nth-child(3) {
            background-color:rgb(203, 203, 132);
            color: rgb(14, 126, 223);

        }

        .desc {
            color:#555;
            margin: top 20px;
            font-size: 15px;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }
        .desc::first-letter {
            font-size: 220%;
            color:#a86f6f;
            font-weight: bold;
        }

        .links {
            margin-top:25px;
        }
        
        a {
            color: #e65c00;
            text-decoration: none;
            font-size: 15px;
            margin: 0 12px;
            padding: 8px 18px;
            border: 2px solid #e65c00;
            border-radius: 8px;
        }

        a:hover {
            background-color:#a86f6f;
            color:white;
        }

    
    </style>
</head>

<body>
    <h1>My Food Menu</h1>
    <p>Pick your favourite dish and dig in!</p>

    <ul>
        <li>Pizza</li>
        <li>Burger</li>
        <li>Tacos - Chef's Special</li>
        <li>Noodles</li>
        <li>Ice Cream</li>
    </ul>

    <p class="desc"> Every dish on this menu is made with love and loads of flavour. Try them all and find your
        favourite!</p>

    <div class="links">
        <a href="#">Order Now</a>
        <a href="#">See More</a>
    </div>
</body>

</html>
