<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My colour Card</title>

    <style>
        /* Universal Selector - applies to everything on the page*/
        *{ 
            font-size: 16px;
        }
        /*Elemet Selectors*/
        body {
            background-color: lightcyan;
        }
        h1{
            color:darkblue;
        }
        h2{
            color:purple
        }
        p{
            color: dimgray;
        }
        /*Classselector*/
        .my-detail {
            color: darkgreen;
            font-weight: bold
        }
        /*ID Selector*/
        #my-card{
            background-color: beige;
        }
           
    </style>
</head>
<body>

    <h1>My Colour Card</h1>
    <!-- Inline CSS:Add style="color:___;" inside this p tag -->
    <p style="color:crimson;" >Hi! This is my very own webpage.</p>
    <div id="my-card">
        <h2>About me</h2>
        <p class="my-detail"> My name is Krittica</p>
        <p class="my-details">My favourite colour is green</p>
        <p class="my-details">My favourite subject is chemistry</p>
        <p class="my-details">My favourite food is pasta</p>
    </div>

    <h2>My favourite things</h2>
    <p>My favourite animal is cat</p>
    <p>My favourite sport is badminton</p>
    <p>My favourite movie is the lion king</p>
</body>
</html>
